<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Оставьте нам отзыв</title>
  <meta name="description" content="Понравилось? Поделитесь впечатлением в Яндекс Картах или 2ГИС — это займёт минуту.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1e2a4a 0%, #2d4a7a 55%, #3a6ea5 100%);
      padding: clamp(12px, 3vh, 24px);
    }

    .card {
      width: 100%;
      max-width: 420px;
      max-height: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: clamp(20px, 4vh, 40px) clamp(18px, 5vw, 28px) clamp(18px, 3.5vh, 32px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      margin-bottom: clamp(10px, 2vh, 18px);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8a94a6;
    }

    .stars {
      font-size: clamp(24px, 8vw, 34px);
      letter-spacing: 4px;
      margin-bottom: clamp(8px, 1.5vh, 14px);
    }

    h1 {
      font-size: clamp(19px, 5.5vw, 26px);
      line-height: 1.25;
      color: #1a1a2e;
      margin-bottom: clamp(6px, 1.2vh, 10px);
    }

    .subtitle {
      font-size: clamp(13px, 3.8vw, 15px);
      color: #6b7280;
      line-height: 1.45;
      margin-bottom: clamp(14px, 3vh, 30px);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: clamp(12px, 2.6vh, 17px) 20px;
      margin-bottom: clamp(10px, 2vh, 14px);
      border-radius: 16px;
      font-size: clamp(15px, 4.5vw, 17px);
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn:active { transform: scale(0.97); }

    .btn svg, .btn img { flex-shrink: 0; }

    .btn-yandex {
      background: #fc3f1d;
      box-shadow: 0 8px 20px rgba(252, 63, 29, 0.35);
    }

    .btn-2gis {
      background: #43b02a;
      box-shadow: 0 8px 20px rgba(67, 176, 42, 0.35);
    }

    .icon-2gis {
      width: 26px;
      height: 26px;
      display: block;
    }

    .note {
      margin-top: clamp(10px, 2vh, 22px);
      font-size: clamp(11px, 3.4vw, 13px);
      color: #9ca3af;
      line-height: 1.45;
    }
  </style>
</head>
